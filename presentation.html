## How do hourly Seoul bike rentals vary by time of day
---


# Hourly Bike Rental Plot

``` r
ggplot(hourly_rentals, aes(x = hour, y = avg_rentals)) +
  geom_line(colour = "blue") +
  labs(
    title = "Average hourly bike rentals in Seoul",
    x = "Hour of the Day",
    y = "Average Number of Bike Rentals Per Hour"
  ) +
  theme_minimal()
```
---
class:center middle
&lt;img src="presentation_files/figure-html/unnamed-chunk-2-1.png" alt="" width="80%" /&gt;
---
class:center middle
##The plot shows the average hourly bike rentals across the day in Seoul.
##The overall distribution follows a bimoal pattern, where the evening peak is higher than the morning one and the lowest point is in the early morning around 5 a.m. 
##This indicates that bike rentals are dominated by commuting, with greater demand during the after-work period.
---
#Average Hourly Bike Rentals by Season in Seoul

``` r
seasonal_avg &lt;- bike_clean %&gt;%
  group_by(seasons) %&gt;%
  summarise(
    avg_rentals = mean(rented_bike_count)
  )
  ggplot(seasonal_avg,
       aes(
         x = factor(seasons,
                    levels = c("Spring", "Summer", "Autumn", "Winter")),
                    y = avg_rentals,
                    fill = seasons
                    )) +
  geom_col() +
  labs(
    title = "Average Bike Rentals by Season in Seoul",
    x = "Season",
    y = "Average Number of Bike Rentals Per Hour"
  ) +
  theme_minimal()
```
---
class:center middle
&lt;img src="presentation_files/figure-html/unnamed-chunk-4-1.png" alt="" width="80%" /&gt;
---
class:center middle
##This bar chart compares average hourly bike rentals across four seasons in Seoul. 
##Average bike rentals peak in summer, are moderatley high in autumn and spring, but drop sharply in winter. 
##The pattern suggests that season and weather are associated with bike‑riding demand, with much lower usage in cold winter months.
---
##Hourly Bike Rental Patterns Differ Across Seasons

``` r
seasonal_rentals &lt;- bike_clean %&gt;%
  group_by(seasons, hour) %&gt;%
  summarise(
    avg_rentals = mean(rented_bike_count)
  )
ggplot(seasonal_rentals,
       aes(x = hour, y = avg_rentals, colour = seasons)) +
  geom_line() +
  labs(
    title = "Hourly Bike Rentals Patterns by Season",
    x = "Hour of the Day",
    y = "Average Hourly Bike Rentals"
  ) +
  theme_minimal()
```
---
class:center middle
&lt;img src="presentation_files/figure-html/unnamed-chunk-6-1.png" alt="" width="80%" /&gt;

All seasons show morning and evening commute peaks: summer has the higherest while winter has the lowest

##How are weather conditions associated with hourly bike rentals?
---
##Bike Rentals vs Temperature

``` r
ggplot(bike_clean,
       aes(x = temperature,
           y = rented_bike_count)) +
  geom_point(alpha = 0.1) +
  geom_smooth() +
  labs(
    title = "Bike Rentals vs Temperature",
    x = "Temperature (°C)",
    y = "Hourly Bike Rentals"
  ) +
  theme_minimal()
```
---
class:center middle
&lt;img src="presentation_files/figure-html/unnamed-chunk-8-1.png" alt="" width="80%" /&gt;
---
class:center middle
##The scatter plot with a LOESS smoother shows a positive, non‑linear association: bike rentals rise with temperature.
##Demand peaks at roughly 20-25 degree centigrade and the rentals starts to fall at higher temperature. 
##The wide spread of points indicates temperature alone cannot fully explain rental volume.
---
##Bike Rentals vs Humidity

``` r
ggplot(bike_clean,
       aes(x = humidity_percent,
           y = rented_bike_count)) +
  geom_point(alpha = 0.1) +
  geom_smooth() +
  labs(
    title = "Bike Rentals vs Humidity",
    x = "Humidity (%)",
    y = "Hourly Bike Rentals"
  ) +
  theme_minimal()
```
---
class:center middle
&lt;img src="presentation_files/figure-html/unnamed-chunk-10-1.png" alt="" width="80%" /&gt;
---
class:center middle
## This scatter plot with a LOESS smoother shows a non-linear relationship between hourly bike rentals and humidity.
##Rental demand rises slightly when humidity increases to around 50-60%, then falls noticeably when humidity higher than around 70%
##The wide spread of points indicates temperature alone cannot fully explain rental volume.
---
Average Bike Rentals by Rainfall Level

``` r
rainfall_level_avg &lt;- bike_clean %&gt;%
  mutate(rain_level = case_when(
    rainfall_mm == 0 ~ "No Rain",
    rainfall_mm &gt; 0 &amp; rainfall_mm &lt;= 2 ~ "0-2 mm",
    rainfall_mm &gt; 2 &amp; rainfall_mm &lt;= 5 ~ "2-5 mm",
    rainfall_mm &gt; 5 ~ "Above 5 mm"
  )) %&gt;%
  group_by(rain_level) %&gt;%
  summarise(avg_rentals = mean(rented_bike_count),
            n = n()
            )

ggplot(rainfall_level_avg,
       aes(x = factor(rain_level,
                      levels = c("No Rain", "0-2 mm", "2-5 mm", "Above 5 mm")),
           y = avg_rentals
           )) +
  geom_col() +
  labs(
    title = "Average Bike Rentals by Rainfall Level",
    x = "Rainfall Level",
    y = "Average Hourly Bike Rentals"
  ) +
  theme_minimal()
```
---
class:center middle
&lt;img src="presentation_files/figure-html/unnamed-chunk-12-1.png" alt="" width="80%" /&gt;
---
class:center middle
##This bar chart shows average hourly bike rentals grouped bu rainfall level.
##Average rentals in no rainy days are far higher than rainy days.As rainfall increases, the average rental volume dropssubstantially.When rainfall level is 0-2mm, the demand of rentals already reduced and stay low for morderate(2-5mm) and heavy rain(above 5mm)
---
class: inverse center middle
##Do rental patterns differ between working days and holidays?
---
##Daily Bike Rentals: Holidays vs Non-Holidays

``` r
daily_rentals &lt;- bike_clean %&gt;%
    group_by(date, holiday) %&gt;%
  summarise(sum_rentals = sum(rented_bike_count),
            n_hours = n()
            ) %&gt;%
  filter(n_hours == 24)

ggplot(daily_rentals,
       aes(x = holiday,
           y = sum_rentals,
           fill = holiday)) +
  geom_boxplot() +
  labs(
    title = "Daily Bike Rentals: Holidays vs Non-Holidays",
    x = "Day Type",
    y = "Daily Bike Rentals"
  ) +
  theme_minimal()
```
---
class:center middle
&lt;img src="presentation_files/figure-html/unnamed-chunk-14-1.png" alt="" width="80%" /&gt;
---
class:center middle
##The boxplot compares the distribution of daily rentals on holidays and non-holidays.
##Non-holiday days have a higher median daily rental count and wider interquartile range.Holiday days show lower median rentals overall,with a narrower spread
##This suggests that bike demand is generally higehr on normal working days, likely because of commuter trips.
---
class:center middle
##Hourly Bike Rental Patterns by Holiday Status

``` r
holiday_hourly &lt;- bike_clean %&gt;%
  group_by(holiday, hour) %&gt;%
  summarise(
    avg_rentals = mean(rented_bike_count)
  )
ggplot(holiday_hourly,
       aes(x = hour,
           y = avg_rentals,
           colour = holiday)) +
  geom_line() +
  labs(
    title = "Hourly Bike Rental Patterns by Holiday Status",
    x = "Hour of the Day",
    y = "Average Hourly Bike Rentals",
  ) +
  theme_minimal()
```
---
class:center middle
&lt;img src="presentation_files/figure-html/unnamed-chunk-16-1.png" alt="" width="80%" /&gt;
---
class:center middle
##This line graph compares average hourly bike rentals across the day for holidays and non holidays
##On non-holidays, there are two peaks: morning peak and evening peak,matching commuting hours. Holidays demand follows a single peak in the afternoon with no extreme sharp floating in short time.
##This difference reflects contrasting purpose:commuting on workdays and leisure on holidays

##Findings &amp; Discussion
---
class: middle
# Findings
###Demand for bike-sharing is strongly associated with time of day and season.
###Weather conditions(eg. temperature and rainfall) `\(\Rightarrow\)` cycling activity
###Daily and hourly rental pattern on holidays `\(\Rightarrow\)` travel purpose.
---
class:middle
#Key limitations
###1.As observational data, the dataset only allows idnetification of associations rather than definitive causal relationships
###2.Variables including temperature,humidity,season and time of day are confounded with one another
###3.The original dataset provides no information about users' actual trip purpose

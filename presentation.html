  geom_line(colour = "blue") +

    y = "Average Number of Bike Rentals Per Hour"

#Average Hourly Bike Rentals by Season in Seoul

``` r
seasonal_avg &lt;- bike_clean %&gt;%
  group_by(seasons) %&gt;%
  summarise(
    avg_rentals = mean(rented_bike_count)
  )
  ggplot(seasonal_avg,
       aes(
         x = factor(seasons,
                    levels = c("Spring", "Summer", "Autumn", "Winter")),
                    y = avg_rentals,
                    fill = seasons
                    )) +
  geom_col() +
  labs(
    title = "Average Bike Rentals by Season in Seoul",
    x = "Season",
    y = "Average Number of Bike Rentals Per Hour"
  ) +
  theme_minimal()
```

##Hourly Bike Rental Patterns Differ Across Seasons

``` r
seasonal_rentals &lt;- bike_clean %&gt;%
  group_by(seasons, hour) %&gt;%
  summarise(
    avg_rentals = mean(rented_bike_count)

ggplot(seasonal_rentals,
       aes(x = hour, y = avg_rentals, colour = seasons)) +
  geom_line() +
  labs(
    title = "Hourly Bike Rentals Patterns by Season",
    x = "Hour of the Day",
    y = "Average Hourly Bike Rentals"
  ) +
  theme_minimal()
```

Average Bike Rentals by Rainfall Level

``` r
rainfall_level_avg &lt;- bike_clean %&gt;%
  mutate(rain_level = case_when(
    rainfall_mm == 0 ~ "No Rain",
    rainfall_mm &gt; 0 &amp; rainfall_mm &lt;= 2 ~ "0-2 mm",
    rainfall_mm &gt; 2 &amp; rainfall_mm &lt;= 5 ~ "2-5 mm",
    rainfall_mm &gt; 5 ~ "Above 5 mm"
  )) %&gt;%
  group_by(rain_level) %&gt;%
  summarise(avg_rentals = mean(rented_bike_count),
            n = n()
            )

ggplot(rainfall_level_avg,
       aes(x = factor(rain_level,
                      levels = c("No Rain", "0-2 mm", "2-5 mm", "Above 5 mm")),
           y = avg_rentals
           )) +
  geom_col() +
  labs(
    title = "Average Bike Rentals by Rainfall Level",
    x = "Rainfall Level",
    y = "Average Hourly Bike Rentals"
  ) +
  theme_minimal()
```

##Do rental patterns differ between working days and holidays?
---
##Daily Bike Rentals: Holidays vs Non-Holidays

``` r
daily_rentals &lt;- bike_clean %&gt;%
    group_by(date, holiday) %&gt;%
  summarise(sum_rentals = sum(rented_bike_count),
            n_hours = n()
            ) %&gt;%
  filter(n_hours == 24)

ggplot(daily_rentals,
       aes(x = holiday,
           y = sum_rentals,
           fill = holiday)) +
  geom_boxplot() +
  labs(
    title = "Daily Bike Rentals: Holidays vs Non-Holidays",
    x = "Day Type",
    y = "Daily Bike Rentals"
  ) +
  theme_minimal()
```
---
class:center middle
&lt;img src="presentation_files/figure-html/unnamed-chunk-14-1.png" alt="" width="80%" /&gt;
---
##Hourly Bike Rental Patterns by Holiday Status

``` r
holiday_hourly &lt;- bike_clean %&gt;%
  group_by(holiday, hour) %&gt;%
  summarise(
    avg_rentals = mean(rented_bike_count)
  )
ggplot(holiday_hourly,
       aes(x = hour,
           y = avg_rentals,
           colour = holiday)) +
  geom_line() +
  labs(
    title = "Hourly Bike Rental Patterns by Holiday Status",
    x = "Hour of the Day",
    y = "Average Hourly Bike Rentals",
  ) +
  theme_minimal()
```
